<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>
    <meta name="description" content="Principal experience design portfolio." />
    <meta property="og:title" content="Portfolio" />
    <meta property="og:description" content="Principal experience design portfolio." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-bg" aria-hidden="true"></div>

    <header class="site-header">
      <a class="brand" href="#top" id="brand-name">Portfolio</a>
      <nav class="main-nav" aria-label="Main navigation" id="main-nav"></nav>
      <a class="btn btn-ghost" href="#" id="resume-link" target="_blank" rel="noreferrer">Resume</a>
    </header>

    <main id="top">
      <section class="hero reveal" id="hero"></section>
      <section class="proof-bar reveal" aria-label="Impact highlights" id="proof-bar"></section>
      <section id="work" class="section reveal"></section>
      <section id="working-style" class="section reveal"></section>
      <section id="testimonials" class="section reveal"></section>
      <section id="writing" class="section reveal"></section>
      <section id="about" class="section reveal"></section>
    </main>

    <section id="contact" class="contact reveal">
      <p class="section-kicker" id="contact-kicker"></p>
      <h2 id="contact-heading"></h2>
      <div class="contact-links" id="contact-links"></div>
    </section>

    <footer class="site-footer">
      <p id="footer-left"></p>
      <p id="footer-right"></p>
    </footer>

    <script src="content.js"></script>
    <script src="script.js"></script>
  </body>
</html>
